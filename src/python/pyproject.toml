[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fnnx"
version = "0.1.0"
description = "A flexible format to package and deploy any ML model."
authors = [
    { name = "Oleh Kostromin", email = "oleh@beastbyte.ai" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
core = ["numpy>=1.0.0,<3.0.0", "onnxruntime>=1.0.0,<2.0.0"]
extras = ["pydantic>=2.0.0,<3.0.0", "pyyaml>=5.1"]
mlflow = ["mlflow>=3.4"]
# Ahead-of-time compiler to C (fnnx.extras.compilers.c); the core runtime never
# depends on onnx. The installed version bounds the opsets that can be compiled.
compiler = ["onnx>=1.16,<2.0"]
# Essential test deps: only the pure FNNX core (format/runtime/validators),
# no mlflow converter and no ML frameworks. Drives the 3.10 / 3.14 CI legs,
# which skip the extra suite (the `test_extra_*` files); see the test workflow.
test-essential = [
    "jsonschema>=4.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=5.1",
    "pytest>=9.1.1",
]
# Full test deps: essential + the mlflow converter (extra) and every ML
# framework it integrates with. Drives the 3.11-3.13 CI legs.
test = [
    "fnnx[test-essential]",
    "mlflow>=3.4",
    "scikit-learn>=1.0.0",
    "pandas>=1.0.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    "catboost>=1.2.0",
    "torch>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "prophet>=1.1.0",
    "tensorflow>=2.12.0",
]

# Explicit, so that a directory the tests write next to the package (`mlruns/`) never
# reaches flat-layout auto-discovery.
[tool.setuptools.packages.find]
include = ["fnnx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = [
    "fnnx/extras/compilers",
    "tests/test_extra_compiler_*.py",
    "tests/test_extra_mlflow_*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["fnnx", "tests"]
check_untyped_defs = true
exclude = [
    "^fnnx/extras/compilers/",
    "^tests/models/",
    "^tests/test_extra_compiler_.*\\.py$",
    "^tests/test_extra_mlflow_.*\\.py$",
]

[[tool.mypy.overrides]]
module = "fnnx.extras.pydantic_models.ops.onnx"
disable_error_code = ["assignment"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]
